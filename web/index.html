  <script>
    window.playChime = function() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        // F4 (349.23 Hz), A4 (440.00 Hz), C5 (523.25 Hz) - F Major Arpeggio
        const notes = [349.23, 440.00, 523.25];
        notes.forEach((freq, idx) => {
          const startTime = ctx.currentTime + idx * 0.16;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          
          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.linearRampToValueAtTime(0.25, startTime + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.85);
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.start(startTime);
          osc.stop(startTime + 0.9);
        });
      } catch (err) {
        console.warn("Audio synthesis error:", err);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
